<script>
const FNS = [
{name:"VLOOKUP",cat:"查找引用",syntax:"=VLOOKUP(查找值, 区域, 返回列号, 0)",desc:"在区域第一列查找值，返回同一行指定列的内容。第4参数填0表示精确匹配。",example:"=VLOOKUP(A2, 员工表!$A$2:$E$100, 3, 0)  → 按工号查姓名"},
{name:"HLOOKUP",cat:"查找引用",syntax:"=HLOOKUP(查找值, 区域, 返回行号, 0)",desc:"按行查找：在区域第一行查找值，返回同一列指定行的内容。",example:"=HLOOKUP(B1, $A$1:$Z$10, 2, 0)"},
{name:"INDEX",cat:"查找引用",syntax:"=INDEX(区域, 行号, [列号])",desc:"返回区域中指定行列交叉处的值，常与MATCH搭配。",example:"=INDEX(B2:D10, 3, 2)  → 返回区域第3行第2列"},
{name:"MATCH",cat:"查找引用",syntax:"=MATCH(查找值, 区域, 0)",desc:"返回查找值在区域中的位置序号。第3参数0=精确匹配。",example:"=MATCH(\"张三\", A2:A100, 0)  → 返回张三所在行号"},
{name:"SUM",cat:"数学统计",syntax:"=SUM(数值1, [数值2], ...)",desc:"对指定数值或区域求和。",example:"=SUM(A1:A100)  → 求A列总和"},
{name:"SUMIF",cat:"数学统计",syntax:"=SUMIF(条件区域, 条件, [求和区域])",desc:"按单个条件对符合条件的单元格求和。",example:"=SUMIF(B2:B100,\"财务部\",C2:C100)  → 财务部薪资合计"},
{name:"SUMIFS",cat:"数学统计",syntax:"=SUMIFS(求和区域, 条件区域1, 条件1, [条件区域2, 条件2]...)",desc:"按多个条件求和，支持多条件筛选。",example:"=SUMIFS(C2:C100,B2:B100,\"财务部\",D2:D100,\">5000\")"},
{name:"COUNT",cat:"数学统计",syntax:"=COUNT(区域)",desc:"统计区域中数值型单元格的个数。",example:"=COUNT(A1:A100)"},
{name:"COUNTA",cat:"数学统计",syntax:"=COUNTA(区域)",desc:"统计区域中非空单元格个数（含文本）。",example:"=COUNTA(A1:A100)  → 有数据的行数"},
{name:"COUNTIF",cat:"数学统计",syntax:"=COUNTIF(区域, 条件)",desc:"按条件统计个数。",example:"=COUNTIF(B2:B100,\"财务部\")"},
{name:"COUNTIFS",cat:"数学统计",syntax:"=COUNTIFS(区域1, 条件1, [区域2, 条件2]...)",desc:"多条件统计个数。",example:"=COUNTIFS(B2:B100,\"财务部\",D2:D100,\">5000\")"},
{name:"AVERAGE",cat:"数学统计",syntax:"=AVERAGE(数值1, [数值2]...)",desc:"求平均值。",example:"=AVERAGE(A1:A100)"},
{name:"MAX / MIN",cat:"数学统计",syntax:"=MAX(区域)  =MIN(区域)",desc:"求区域最大值/最小值。",example:"=MAX(A1:A100)  → 最高分"},
{name:"IF",cat:"逻辑函数",syntax:"=IF(条件, 真值, 假值)",desc:"条件判断，满足返回真值否则返回假值。",example:"=IF(B2>=60,\"及格\",\"不及格\")"},
{name:"IFERROR",cat:"逻辑函数",syntax:"=IFERROR(公式, 出错时返回)",desc:"公式出错时返回指定值，避免显示#N/A等错误。",example:"=IFERROR(VLOOKUP(A2,B:C,2,0),\"未找到\")"},
{name:"AND / OR",cat:"逻辑函数",syntax:"=AND(条件1, 条件2)  =OR(条件1, 条件2)",desc:"多个条件同时满足(AND)/任一满足(OR)。",example:"=IF(AND(B2>60,C2=\"男\"),\"符合\",\"\")"},
{name:"LEFT",cat:"文本函数",syntax:"=LEFT(文本, 位数)",desc:"从文本左侧提取指定位数。",example:"=LEFT(A2,3)  → 取前3个字符"},
{name:"RIGHT",cat:"文本函数",syntax:"=RIGHT(文本, 位数)",desc:"从文本右侧提取指定位数。",example:"=RIGHT(A2,4)  → 取后4位"},
{name:"MID",cat:"文本函数",syntax:"=MID(文本, 起始位, 位数)",desc:"从指定位置提取中间字符。",example:"=MID(A2,4,3)  → 从第4位取3个字符"},
{name:"LEN",cat:"文本函数",syntax:"=LEN(文本)",desc:"返回文本长度（字符数）。",example:"=LEN(A2)  → 身份证号长度"},
{name:"FIND",cat:"文本函数",syntax:"=FIND(要找的, 在哪找, [起始位])",desc:"查找字符在文本中的位置（区分大小写）。",example:"=FIND(\"@\",A2)  → @在邮箱中的位置"},
{name:"TRIM",cat:"文本函数",syntax:"=TRIM(文本)",desc:"清除文本首尾多余空格。",example:"=TRIM(A2)  → 清理后VLOOKUP不再报错"},
{name:"SUBSTITUTE",cat:"文本函数",syntax:"=SUBSTITUTE(文本, 旧文本, 新文本, [替换第几个])",desc:"替换文本中指定内容。",example:"=SUBSTITUTE(A2,\"-\",\"\")  → 去掉横杠"},
{name:"TEXT",cat:"文本函数",syntax:"=TEXT(数值, 格式)",desc:"按指定格式将数值转成文本。",example:"=TEXT(A2,\"yyyy年mm月dd日\")"},
{name:"TEXTJOIN",cat:"文本函数",syntax:"=TEXTJOIN(分隔符, 忽略空值, 区域)",desc:"将区域内文本用分隔符合并成一个字符串。",example:"=TEXTJOIN(\",\",TRUE,A1:A10)"},
{name:"DATE",cat:"日期时间",syntax:"=DATE(年, 月, 日)",desc:"根据年月日构造日期。",example:"=DATE(2025,12,31)"},
{name:"TODAY",cat:"日期时间",syntax:"=TODAY()",desc:"返回今天的日期（随系统更新）。",example:"=TODAY()  → 2025-08-02"},
{name:"DATEDIF",cat:"日期时间",syntax:"=DATEDIF(开始日期, 结束日期, 单位)",desc:"计算两个日期之差。单位：Y年/M月/D日。",example:"=DATEDIF(A2,TODAY(),\"Y\")  → 年龄"},
{name:"ROUND",cat:"数学统计",syntax:"=ROUND(数值, 小数位)",desc:"四舍五入到指定小数位。",example:"=ROUND(3.14159,2)  → 3.14"},
{name:"ROUNDUP / ROUNDDOWN",cat:"数学统计",syntax:"=ROUNDUP(数值, 小数位)  =ROUNDDOWN(数值, 小数位)",desc:"向上/向下舍入。",example:"=ROUNDUP(3.1,0)  → 4"},
{name:"INT",cat:"数学统计",syntax:"=INT(数值)",desc:"向下取整。",example:"=INT(3.9)  → 3"},
{name:"MOD",cat:"数学统计",syntax:"=MOD(被除数, 除数)",desc:"取余数。",example:"=MOD(10,3)  → 1"},
{name:"ABS",cat:"数学统计",syntax:"=ABS(数值)",desc:"取绝对值。",example:"=ABS(-5)  → 5"},
{name:"SUMPRODUCT",cat:"数学统计",syntax:"=SUMPRODUCT(区域1, 区域2)",desc:"对应元素相乘后求和，常用于多条件计数。",example:"=SUMPRODUCT((B2:B100=\"财务部\")*(C2:C100>5000))"},
{name:"OFFSET",cat:"查找引用",syntax:"=OFFSET(基点, 下移行, 右移列, [高度], [宽度])",desc:"返回偏移后的区域引用，常用于动态区域。",example:"=SUM(OFFSET(A1,0,0,10,1))  → A1向下10行求和"},
{name:"INDIRECT",cat:"查找引用",syntax:"=INDIRECT(单元格地址文本)",desc:"把文本变成真实引用，实现跨表动态引用。",example:"=INDIRECT(\"Sheet2!A1\")"}
];
const list = document.getElementById('list');
const total = document.getElementById('total');
total.textContent = FNS.length;
function render(arr){
  list.innerHTML = arr.map((f,i)=>`
    <div class="fn-card" onclick="this.classList.toggle('open')">
      <div class="fn-head">
        <span class="fn-name">${f.name}</span>
        <span class="fn-cat">${f.cat}</span>
      </div>
      <div class="fn-syntax">${f.syntax}</div>
      <div class="fn-desc">${f.desc}</div>
      <div class="fn-example">💡 ${f.example}</div>
    </div>`).join('');
}
render(FNS);
document.getElementById('search').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  if(!q){ render(FNS); total.textContent = FNS.length; return; }
  const res = FNS.filter(f => f.name.toLowerCase().includes(q) || f.desc.includes(q) || f.cat.includes(q));
  render(res); total.textContent = res.length;
});
</script>
